<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarukBro TV - Premium IPTV</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; overflow: hidden; }
        .bg-glow {
            position: absolute; width: 400px; height: 400px; background: #3b82f6;
            filter: blur(150px); opacity: 0.3; border-radius: 50%; z-index: -1;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative selection:bg-blue-500 selection:text-white">
    
    <!-- Background Glow Effects -->
    <div class="bg-glow top-0 left-0"></div>
    <div class="bg-glow bottom-0 right-0" style="background: #06b6d4;"></div>

    <div class="text-center z-10 px-6 max-w-3xl">
        <div class="mb-6 inline-flex items-center justify-center w-24 h-24 rounded-full bg-blue-500/10 border border-blue-500/30 shadow-[0_0_30px_rgba(59,130,246,0.3)]">
            <i class="fa-solid fa-tv text-5xl text-blue-400 animate-pulse"></i>
        </div>
        
        <h1 class="text-5xl md:text-7xl font-black mb-6 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-cyan-300 to-blue-500 drop-shadow-lg">
            FarukBro TV
        </h1>
        
        <p class="text-slate-300 text-lg md:text-xl mb-10 max-w-2xl mx-auto leading-relaxed">
            Experience premium Live TV, Sports, Movies, and News with zero buffering. The ultimate IPTV streaming platform completely free for you.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-5 justify-center items-center">
            <!-- Redirects to the /online folder -->
            <a href="/online" class="bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white px-10 py-4 rounded-full font-bold text-lg transition-all duration-300 shadow-[0_0_20px_rgba(59,130,246,0.4)] hover:shadow-[0_0_30px_rgba(59,130,246,0.6)] flex items-center justify-center gap-3 transform hover:-translate-y-1">
                <i class="fa-solid fa-play text-xl"></i> Launch Web Player
            </a>
        </div>

        <div class="mt-16 grid grid-cols-2 md:grid-cols-4 gap-6 text-slate-400 text-sm font-medium">
            <div class="flex flex-col items-center p-4 bg-white/5 rounded-2xl border border-white/10 backdrop-blur-sm">
                <i class="fa-solid fa-rocket text-2xl mb-2 text-blue-400"></i> Fast Stream
            </div>
            <div class="flex flex-col items-center p-4 bg-white/5 rounded-2xl border border-white/10 backdrop-blur-sm">
                <i class="fa-solid fa-mobile-screen text-2xl mb-2 text-green-400"></i> Installable PWA
            </div>
            <div class="flex flex-col items-center p-4 bg-white/5 rounded-2xl border border-white/10 backdrop-blur-sm">
                <i class="fa-solid fa-clone text-2xl mb-2 text-purple-400"></i> PiP & Mini Player
            </div>
            <div class="flex flex-col items-center p-4 bg-white/5 rounded-2xl border border-white/10 backdrop-blur-sm">
                <i class="fa-solid fa-magnifying-glass text-2xl mb-2 text-yellow-400"></i> Smart Search
            </div>
        </div>
        
        <p class="mt-10 text-xs text-slate-500">© 2026 FarukBro - Premium IPTV.</p>
    </div>

</body>
</html>
