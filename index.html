<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Tv - Premium Live Streaming</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fallback Auto Redirect (If JS is disabled) -->
    <noscript>
        <meta http-equiv="refresh" content="5;url=/online" />
    </noscript>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0f19; /* Deep dark blue */
            color: #ffffff; 
            overflow: hidden; 
        }

        /* Beautiful Ambient Aurora Background */
        .aurora-bg {
            position: absolute; 
            border-radius: 50%; 
            filter: blur(120px); 
            opacity: 0.4; 
            z-index: -1;
            animation: float-aurora 10s infinite ease-in-out alternate;
        }

        @keyframes float-aurora {
            0% { transform: translate(0px, 0px) scale(1); }
            100% { transform: translate(30px, -50px) scale(1.1); }
        }

        /* Premium Glass Card */
        .premium-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        /* Circular Progress Animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(59, 130, 246, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen relative selection:bg-blue-500 selection:text-white">
    
    <!-- Ambient Aurora Glows -->
    <div class="aurora-bg bg-blue-600 w-[500px] h-[500px] top-[-10%] left-[-10%]"></div>
    <div class="aurora-bg bg-cyan-400 w-[400px] h-[400px] bottom-[-10%] right-[-5%]"></div>
    <div class="aurora-bg bg-indigo-600 w-[300px] h-[300px] top-[20%] right-[20%] opacity-20"></div>

    <!-- Main Content Container -->
    <div class="z-10 px-4 w-full max-w-3xl flex flex-col items-center">
        
        <div class="premium-glass rounded-[2.5rem] p-8 md:p-14 w-full text-center relative overflow-hidden">
            
            <!-- Top Badge -->
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold tracking-wide uppercase mb-6">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span> Premium Streaming
            </div>

            <!-- Icon & Timer Ring -->
            <div class="relative inline-flex items-center justify-center w-28 h-28 mb-6">
                <div class="absolute inset-0 bg-blue-500/10 rounded-full blur-md"></div>
                <i class="fa-solid fa-tv text-4xl text-transparent bg-clip-text bg-gradient-to-br from-blue-400 to-cyan-300 drop-shadow-lg z-10"></i>
                
                <!-- SVG Timer Circle -->
                <svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]" viewBox="0 0 100 100">
                    <circle class="text-white/5" stroke-width="3" stroke="currentColor" fill="transparent" r="47" cx="50" cy="50" />
                    <circle id="progress-circle" class="text-blue-500 progress-ring__circle" stroke-width="3" stroke-dasharray="295.31" stroke-dashoffset="0" stroke-linecap="round" stroke="currentColor" fill="transparent" r="47" cx="50" cy="50" />
                </svg>
            </div>
            
            <!-- Title & Description -->
            <h1 class="text-5xl md:text-6xl font-extrabold mb-4 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-white drop-shadow-sm">
                Online Tv
            </h1>
            
            <p class="text-slate-400 text-base md:text-lg mb-10 max-w-xl mx-auto font-light leading-relaxed">
                Welcome to your ultimate entertainment hub. Watch premium live channels, movies, and sports with zero buffering in a sleek, ad-free environment.
            </p>
            
            <!-- Loading Status & Button -->
            <div class="flex flex-col items-center justify-center gap-6">
                
                <div class="flex items-center gap-3 text-slate-300 bg-white/5 px-5 py-2.5 rounded-full border border-white/5">
                    <i class="fa-solid fa-circle-notch fa-spin text-blue-400"></i>
                    <span class="text-sm font-medium">Entering platform in <span id="countdown-text" class="text-white font-bold text-lg w-4 inline-block text-center">5</span> seconds...</span>
                </div>

                <a href="/online" class="hover-lift bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-10 py-3.5 rounded-full font-semibold text-lg flex items-center justify-center gap-3 w-full sm:w-auto shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                    Enter Manually <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>

            <!-- Features -->
            <div class="mt-12 pt-8 border-t border-white/10 grid grid-cols-3 gap-4 text-slate-400 text-sm font-medium">
                <div class="flex flex-col items-center gap-2">
                    <i class="fa-solid fa-bolt text-blue-400 text-xl"></i> Hyper Fast
                </div>
                <div class="flex flex-col items-center gap-2">
                    <i class="fa-solid fa-mobile-screen text-cyan-400 text-xl"></i> PWA App
                </div>
                <div class="flex flex-col items-center gap-2">
                    <i class="fa-solid fa-clone text-indigo-400 text-xl"></i> PiP Player
                </div>
            </div>

        </div>
        
        <p class="mt-8 text-xs text-slate-500 font-medium tracking-wide">© 2026 Online Tv - Premium Experience.</p>
    </div>

    <!-- JavaScript for 5 Second Auto Redirect & Animation -->
    <script>
        let timeLeft = 5;
        const totalTime = 5;
        const countdownText = document.getElementById('countdown-text');
        const progressCircle = document.getElementById('progress-circle');
        
        // Calculate circumference for the SVG circle (2 * pi * r) where r=47
        const circumference = 2 * Math.PI * 47; 
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
        
        function setProgress(percent) {
            const offset = circumference - (percent / 100 * circumference);
            progressCircle.style.strokeDashoffset = offset;
        }

        const timer = setInterval(() => {
            timeLeft--;
            countdownText.innerText = timeLeft;
            
            // Update Circle Progress
            const percentage = (timeLeft / totalTime) * 100;
            setProgress(percentage);

            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.href = '/online'; 
            }
        }, 1000);
    </script>

    <!-- Source Code Protection System -->
    <script>
        // Disable Right-Click
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Disable F12, Ctrl+U, Ctrl+Shift+I, Ctrl+S
        document.onkeydown = function(e) {
            if (e.keyCode == 123) { return false; } // F12
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; } // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; } // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; } // Ctrl+Shift+J
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; } // Ctrl+U
            if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { return false; } // Ctrl+S
        };

        // Anti-Debugger (Freezes Developer Tools if somehow opened)
        setInterval(function() {
            (function() { return false; }['constructor']('debugger')());
        }, 100);
    </script>
</body>
</html>
